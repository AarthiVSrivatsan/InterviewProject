<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Load Recruitment Drive</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── page-level layout ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f5e9 100%);
        }

        .load-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 24px rgba(15,23,42,0.10);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
        }

        .load-card h1 {
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
            color: #0f172a;
        }

        .load-card .subtitle {
            font-size: 0.92rem;
            color: #64748b;
            margin-bottom: 2rem;
        }

        /* ── status / feedback ── */
        #statusBox {
            display: none;
            border-radius: 0.5rem;
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            margin-top: 1.25rem;
            line-height: 1.5;
        }

        #statusBox.info    { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
        #statusBox.success { background:#dcfce7; color:#166534; border:1px solid #86efac; }
        #statusBox.error   { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }

        /* ── step list shown during loading ── */
        .steps { list-style: none; margin-top: 0.5rem; }
        .steps li {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.3rem 0;
            font-size: 0.875rem;
            color: #475569;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .steps li.active  { opacity: 1; color: #1d4ed8; }
        .steps li.done    { opacity: 1; color: #059669; }
        .steps li.failed  { opacity: 1; color: #dc2626; }
        .steps li .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        /* spinner inside button */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-success { width: 100%; margin-top: 0; }
    </style>
</head>
<body>
<div class="load-card">
    <h1>🎯 Load Recruitment Drive</h1>
    <p class="subtitle">Enter a recruitment drive name to fetch all interview data and jump straight to the progress page.</p>

    <div class="form-group" style="margin-bottom:1rem;">
        <label for="driveInput">Recruitment Drive Name</label>
        <input
            type="text"
            id="driveInput"
            placeholder="e.g. Campus Drive 2025"
            onkeypress="if(event.key==='Enter') loadDrive()"
            autocomplete="off"
        />
    </div>

    <button class="btn-success" id="loadBtn" onclick="loadDrive()">
        Load &amp; Continue →
    </button>

    <div id="statusBox"></div>
</div>

<script>
    const BASE_URL = "https://zsinterviews-60051110991.development.catalystserverless.in/server/zs_interviews_function";

    /* ── helpers ── */
    function showStatus(type, html) {
        const box = document.getElementById('statusBox');
        box.className = type;
        box.innerHTML = html;
        box.style.display = 'block';
    }

    function setLoading(on) {
        const btn = document.getElementById('loadBtn');
        btn.disabled = on;
        btn.innerHTML = on
            ? '<span class="spinner"></span> Loading…'
            : 'Load &amp; Continue →';
    }

    function buildSteps(labels) {
        return `<ul class="steps">${labels.map((l,i)=>`<li id="step${i}"><span class="dot"></span>${l}</li>`).join('')}</ul>`;
    }

    function stepState(idx, state) {           // state: active | done | failed
        const el = document.getElementById('step'+idx);
        if (el) el.className = state;
    }

    /* ── main loader ── */
    async function loadDrive() {
        const name = document.getElementById('driveInput').value.trim();
        if (!name) {
            showStatus('error', '⚠️ Please enter a recruitment drive name.');
            return;
        }

        setLoading(true);
        showStatus('info', buildSteps([
            'Finding recruitment drive…',
            'Fetching students…',
            'Fetching faculty / panel members…',
            'Fetching interview assignments…',
            'Fetching verdicts…',
            'Saving to session…'
        ]));

        try {
            /* ── Step 0: find recruitment drive by name ── */
            stepState(0, 'active');
            const driveRes = await fetch(`${BASE_URL}/recruitment-drive?name=${encodeURIComponent(name)}`);
            if (!driveRes.ok) throw new Error(`Drive lookup failed (HTTP ${driveRes.status})`);
            const driveData = await driveRes.json();

            // Accept either an array or a single object
            const drive = Array.isArray(driveData) ? driveData[0] : driveData;
            if (!drive || !drive.ROWID) throw new Error(`No recruitment drive found with name "${name}"`);
            const driveId = drive.ROWID;
            stepState(0, 'done');

            /* ── Step 1: fetch students for this drive ── */
            stepState(1, 'active');
            const studentsRes = await fetch(`${BASE_URL}/student?recruitment_drive_id=${driveId}`);
            if (!studentsRes.ok) throw new Error(`Students fetch failed (HTTP ${studentsRes.status})`);
            const studentsCatData = await studentsRes.json();   // [{ROWID, Student_Name, …}]
            const studentNames = studentsCatData.map(s => s.ZS28_Students.Student_Name);
            stepState(1, 'done');

            /* ── Step 2: fetch faculty / panel members ── */
            stepState(2, 'active');
            const facRes = await fetch(`${BASE_URL}/faculty?recruitment_drive_id=${driveId}`);
            if (!facRes.ok) throw new Error(`Faculty fetch failed (HTTP ${facRes.status})`);
            const panelMembersCatData = await facRes.json();    // [{ROWID, name, …}]
            const panelNames = panelMembersCatData.map(f => f.Faculty.name);
            stepState(2, 'done');

            /* ── Step 3: fetch interview assignments ── */
            stepState(3, 'active');
            const interviewsRes = await fetch(`${BASE_URL}/interview?recruitment_drive_id=${driveId}`);
            if (!interviewsRes.ok) throw new Error(`Interviews fetch failed (HTTP ${interviewsRes.status})`);
            const interviewsCatData = await interviewsRes.json();  // [{ROWID, student_id, faculty_id, …}]
            stepState(3, 'done');

            /* ── Step 4: fetch verdicts ── */
            stepState(4, 'active');
            // Build assignments map  { studentName: { interviewId: facultyName } }
            // and verdicts map        { studentName: { interviewId: verdictValue } }
            const assignmentsData = {};
            const verdicts = {};

            studentNames.forEach(sName => { assignmentsData[sName] = {}; });

            interviewsCatData.forEach(iv => {
                // resolve student name
                const stuObj = studentsCatData.find(s => s.ROWID === iv.student_id);
                const facObj = panelMembersCatData.find(f => f.ROWID === iv.faculty_id);
                if (!stuObj) return;
                const sName = stuObj.Student_Name;
                const fName = facObj ? facObj.name : '';
                const iId   = String(iv.ROWID);

                assignmentsData[sName][iId] = fName;

                if (iv.verdict && iv.verdict !== '') {
                    if (!verdicts[sName]) verdicts[sName] = {};
                    verdicts[sName][iId] = iv.verdict;
                }
            });

            // Build interviews array for interviewassign page compatibility
            // Collect unique interview slot ids from all assignments
            const allInterviewIds = [...new Set(interviewsCatData.map(iv => String(iv.ROWID)))];
            const interviewsData = allInterviewIds.map((id, idx) => ({
                id,
                name: `Interview-${idx + 1}`,
                isHead: false
            }));
            stepState(4, 'done');

            /* ── Step 5: persist to localStorage ── */
            stepState(5, 'active');
            localStorage.setItem('recruitmentDriveId',   driveId);
            localStorage.setItem('recruitmentDriveName', name);
            localStorage.setItem('studentsData',         JSON.stringify(studentNames));
            localStorage.setItem('studentsCatData',      JSON.stringify(studentsCatData));
            localStorage.setItem('panelMembersData',     JSON.stringify(panelNames));
            localStorage.setItem('panelMembersCatData',  JSON.stringify(panelMembersCatData));
            localStorage.setItem('interviewsCatData',    JSON.stringify(interviewsCatData));
            localStorage.setItem('assignmentsData',      JSON.stringify(assignmentsData));
            localStorage.setItem('interviewsData',       JSON.stringify(interviewsData));
            localStorage.setItem('verdicts',             JSON.stringify(verdicts));
            stepState(5, 'done');

            /* ── All done — redirect ── */
            showStatus('success',
                `✅ Drive <strong>${name}</strong> loaded successfully!<br>
                 <small>${studentNames.length} students · ${panelNames.length} faculty · ${interviewsCatData.length} interviews</small><br>
                 <small style="color:#059669;">Redirecting to progress page…</small>`
            );

            setTimeout(() => { window.location.href = 'progress.html'; }, 1200);

        } catch (err) {
            // Mark last active step as failed
            document.querySelectorAll('.steps li.active').forEach(el => el.className = 'failed');
            showStatus('error', `❌ <strong>Error:</strong> ${err.message}`);
            setLoading(false);
        }
    }
</script>
</body>
</html>
